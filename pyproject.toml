[project]
name = "codefence"  # distribution name; the import package and CLI stay `fence`
dynamic = ["version"]  # single source: fence/__init__.py
description = "Records why code exists and warns before it is removed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Aryan Pol" }]
keywords = ["git", "code-review", "provenance", "chestertons-fence", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "typer>=0.12",
    "unidiff>=0.7.5",
    "pydantic>=2.6",
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
]

[project.scripts]
fence = "fence.cli:app"
codefence = "fence.cli:app"

[project.urls]
Homepage = "https://github.com/aryanpol73/fence"
Issues = "https://github.com/aryanpol73/fence/issues"
Changelog = "https://github.com/aryanpol73/fence/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "fence/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["fence"]

[tool.hatch.build.targets.sdist]
exclude = ["/evals/results", "/dist", "/.github"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S603", "S607"]  # we call git via list-form subprocess on purpose; see fence/git/runner.py

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "E501"]
"demo/**" = ["S101"]
