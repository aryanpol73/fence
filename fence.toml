# Fence's own configuration (dogfooding). Every key is optional; see `fence config`
# for the full list with defaults. Secrets never go in this file; they come from
# the environment.

[performance]
# Every git call is killed after this many seconds.
git_timeout_seconds = 10

[llm]
# Off by default; the core never needs it. Model names live here, never in code.
enabled = false
model = ""
redact_paths = ["secrets/**", "**/*.env", "**/.env"]
