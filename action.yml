name: gitfence
description: Warn when a pull request removes or weakens code that exists for a reason.
branding:
  icon: shield
  color: orange
inputs:
  fail:
    description: "Fail the job when Fence says KEEP (exit 2/3). 'false' only reports."
    default: "true"
  fail-on-error:
    description: "Fail the job when Fence itself errors (exit 1/4). Default: fail open."
    default: "false"
  comment:
    description: "Post one sticky PR comment (needs pull-requests: write; skipped on forks)."
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - id: check
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        set +e
        fence index -q
        fence check --pr --base "origin/${BASE_REF}" --format markdown -o fence-report.md --no-color
        code=$?
        echo "code=$code" >> "$GITHUB_OUTPUT"
        cat fence-report.md >> "$GITHUB_STEP_SUMMARY"
        exit 0
    - if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
      run: fence comment --report fence-report.md --pr "$PR" || true
    - shell: bash
      env:
        CODE: ${{ steps.check.outputs.code }}
        FAIL: ${{ inputs.fail }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
      run: |
        case "$CODE" in
          0) exit 0 ;;
          2|3) [ "$FAIL" = "true" ] && { echo "Fence: KEEP findings; see the report."; exit 1; } || exit 0 ;;
          *) [ "$FAIL_ON_ERROR" = "true" ] && exit 1 || { echo "Fence errored (exit $CODE); failing open."; exit 0; } ;;
        esac
